name: M3U Playlist Pipeline (Sequential)

on:
  schedule:
    - cron: '0 * * * *'          # Mỗi giờ (giống stalker_to_m3u cũ)
  workflow_dispatch:
  repository_dispatch:
    types: [stalker_to_m3u]       # Giữ lại nếu có hệ thống ngoài gọi

permissions:
  contents: write

# 🔒 Rất quan trọng: KHÔNG cancel để tránh mất dữ liệu giữa chuỗi
concurrency:
  group: m3u-pipeline-main
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # đủ cho 3 script Python nặng
    env:
      TZ: Asia/Ho_Chi_Minh

    steps:
      # ============================================================
      # 0. CHUẨN BỊ
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '1'                # repo đang dùng branch tên '1'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests curl_cffi pycountry aiohttp pyyaml
      
      # ============================================================
      # ② FootOnSat Optimize → live_schedule_Optimize.m3u
      # ============================================================
      - name: "② Convert URLs to local paths in M3U_list.txt"
        run: |
          sed -i 's|https://raw.githubusercontent.com/sani3122/Something-Special/1/||g' M3U_list.txt

      - name: "② Chạy footonsat_schedule_live_optimized.py"
        run: python footonsat_schedule_live_optimized.py --skip-validation

      - name: "② Commit live_schedule_Optimize.m3u"
        run: |
          git add live_schedule_Optimize.m3u
          git diff --cached --quiet && echo "⏭️ Không có thay đổi" && exit 0
          git commit -m "② Update live_schedule_Optimize.m3u [skip ci]"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            git pull --rebase --autostash origin 1 && git push origin 1 && exit 0
            echo "Retry $i..."; sleep 5
          done
          exit 1
